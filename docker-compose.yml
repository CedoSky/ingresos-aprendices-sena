# ════════════════════════════════════════════════════════════════════════════
#  DOCKER COMPOSE — Sistema de Control de Ingresos SENA
#  Configuración Multi-Contenedor para Desarrollo y Producción
# ════════════════════════════════════════════════════════════════════════════

version: '3.9'

services:
  # ══════════════════════════════════════════════════════════════════════════
  # BASE DE DATOS — PostgreSQL
  # ══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:16-alpine
    container_name: sena_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sena_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sena_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-sena_aprendices}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      TZ: America/Bogota
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sena_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════════════
  # REDIS — Cache/Sessions (Opcional pero recomendado)
  # ══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: sena_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_2026} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      TZ: America/Bogota
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sena_network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ══════════════════════════════════════════════════════════════════════════
  # BACKEND — Flask API + Gunicorn
  # ══════════════════════════════════════════════════════════════════════════
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sena_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Flask Configuration
      FLASK_APP: app.py
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 8000

      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-sena_user}:${POSTGRES_PASSWORD:-sena_secure_password_2026}@postgres:5432/${POSTGRES_DB:-sena_aprendices}
      
      # Redis Configuration
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secure_2026}@redis:6379/0
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Define ENCRYPTION_KEY en tu .env (ver .env.example)}"

      # Usuarios por defecto (admin/vigilante)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      VIGILANTE_PASSWORD: ${VIGILANTE_PASSWORD:-}

      # CORS y almacenamiento de respaldos
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-usb}
      DEV_PIN_SECRET: ${DEV_PIN_SECRET:-}

      # Wompi (pasarela de pagos)
      WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
      WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
      WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
      WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
      WOMPI_ENV: ${WOMPI_ENV:-sandbox}

      # AWS S3 (Opcional para respaldos)
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      
      # Email Configuration (Gmail)
      GMAIL_REMITENTE: ${GMAIL_REMITENTE:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_NOMBRE: ${GMAIL_NOMBRE:-SENA — Sistema de Ingresos}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      
      # ESP32 Configuration
      ESP32_IP: ${ESP32_IP:-192.168.1.100}
      ESP32_TIMEOUT: ${ESP32_TIMEOUT:-10}
      
      # MQTT Configuration (Opcional)
      MQTT_BROKER: ${MQTT_BROKER:-}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      
      # Timezone
      TZ: America/Bogota

    volumes:
      # Para desarrollo: monta el código fuente
      - ./backend:/app:delegated
      - /app/__pycache__
      - ./logs:/app/logs
      - ./instance:/app/instance

    ports:
      - "${FLASK_PORT:-8000}:8000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - sena_network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ══════════════════════════════════════════════════════════════════════════
  # FRONTEND — Nginx (Reverse Proxy + Servir archivos estáticos)
  # ══════════════════════════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: sena_web
    restart: unless-stopped
    depends_on:
      - api
      
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf:ro

    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"

    environment:
      TZ: America/Bogota

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - sena_network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ════════════════════════════════════════════════════════════════════════════
# VOLÚMENES PERSISTENTES
# ════════════════════════════════════════════════════════════════════════════
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ════════════════════════════════════════════════════════════════════════════
# RED PERSONALIZADA
# ════════════════════════════════════════════════════════════════════════════
networks:
  sena_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ════════════════════════════════════════════════════════════════════════════
# INSTRUCCIONES DE USO
# ════════════════════════════════════════════════════════════════════════════
# 
# CONSTRUIR:
#   docker-compose build
#
# INICIAR:
#   docker-compose up -d
#
# VER LOGS:
#   docker-compose logs -f api
#   docker-compose logs -f web
#   docker-compose logs -f postgres
#
# ACCEDER:
#   Frontend:  http://localhost (o http://localhost:3000 según config)
#   Adminer:   http://localhost:8080 (BD viewer)
#
# DETENER:
#   docker-compose down
#
# LIMPIAR TODO:
#   docker-compose down -v
#
# ════════════════════════════════════════════════════════════════════════════

