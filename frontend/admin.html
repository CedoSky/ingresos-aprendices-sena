<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SENA - Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #003087 0%, #005EB8 100%);
            color: white;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 300;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }

        .stat-card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.4s ease;
            position: relative;
            overflow: hidden;
            border-left: 5px solid #003087;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200px;
            height: 200px;
            background: url('data:image/svg+xml,<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><circle cx="50" cy="50" r="40" fill="rgba(0,174,239,0.1)"/></svg>');
            opacity: 0.5;
        }

        .stat-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
        }

        .stat-card.entrada {
            border-left-color: #39A900;
        }

        .stat-card.salida {
            border-left-color: #FF5800;
        }

        .stat-label {
            color: #999;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .stat-value {
            font-size: 2.8rem;
            font-weight: 800;
            color: #003087;
            line-height: 1;
        }

        .stat-card.entrada .stat-value {
            color: #39A900;
        }

        .stat-card.salida .stat-value {
            color: #FF5800;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .panel {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .panel:hover {
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.12);
        }

        .panel h2 {
            color: #003087;
            margin-bottom: 25px;
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 3px solid #00AEEF;
            padding-bottom: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            color: #555;
            font-weight: 700;
            margin-bottom: 8px;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #E8E8E8;
            border-radius: 12px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #00AEEF;
            box-shadow: 0 0 0 4px rgba(0, 174, 239, 0.1);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, #00AEEF 0%, #0084bf 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(0, 174, 239, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 174, 239, 0.5);
        }

        .btn-success {
            background: linear-gradient(135deg, #39A900 0%, #2a8000 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(57, 169, 0, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(57, 169, 0, 0.5);
        }

        .table-panel {
            grid-column: 1 / -1;
        }

        .table-responsive {
            overflow-x: auto;
            border-radius: 12px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
        }

        table thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }

        table th {
            color: #003087;
            padding: 18px;
            text-align: left;
            font-weight: 800;
            border-bottom: 2px solid #00AEEF;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        table td {
            padding: 14px 18px;
            border-bottom: 1px solid #f0f0f0;
        }

        table tbody tr {
            transition: all 0.3s ease;
        }

        table tbody tr:hover {
            background: #f5f7fa;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-entrada {
            background: linear-gradient(135deg, #c8e6c9 0%, #a5d6a7 100%);
            color: #2a8000;
        }

        .badge-salida {
            background: linear-gradient(135deg, #ffccba 0%, #ffab91 100%);
            color: #cc4600;
        }

        .alert {
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: none;
            font-weight: 600;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert.success {
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            color: #2a8000;
            border-left: 4px solid #39A900;
        }

        .alert.error {
            background: linear-gradient(135deg, #ffe0b2 0%, #ffccba 100%);
            color: #cc4600;
            border-left: 4px solid #FF5800;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚙️ Panel Administrativo</h1>
        <p>Gestión completa del sistema SENA Access Control</p>
    </div>

    <div class="container">
        <!-- ESTADÍSTICAS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">📊 Total</div>
                <div class="stat-value" id="total">0</div>
            </div>
            <div class="stat-card entrada">
                <div class="stat-label">➕ Entradas</div>
                <div class="stat-value" id="entradas">0</div>
            </div>
            <div class="stat-card salida">
                <div class="stat-label">➖ Salidas</div>
                <div class="stat-value" id="salidas">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">👥 Usuarios</div>
                <div class="stat-value" id="usuarios">0</div>
            </div>
        </div>

        <!-- FORMULARIOS -->
        <div class="content-grid">
            <div class="panel">
                <h2>👥 Registrar Persona</h2>
                <div class="alert" id="alerta-persona"></div>
                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="nombre-persona" placeholder="Nombre completo">
                </div>
                <div class="form-group">
                    <label>Cédula</label>
                    <input type="text" id="cedula" placeholder="1023456789">
                </div>
                <div class="form-group">
                    <label>Perfil</label>
                    <select id="perfil">
                        <option value="APRENDIZ">Aprendiz</option>
                        <option value="INSTRUCTOR">Instructor</option>
                        <option value="VISITANTE">Visitante</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="telefono" placeholder="3001234567">
                </div>
                <button class="btn btn-success" onclick="crearPersona()">✓ Registrar</button>
            </div>
        </div>

        <!-- TABLAS -->
        <div class="content-grid">
            <div class="panel table-panel">
                <h2>📋 Últimos Registros</h2>
                <div class="table-responsive">
                    <table id="tabla-registros">
                        <thead>
                            <tr>
                                <th>Persona</th>
                                <th>Cédula</th>
                                <th>Tipo</th>
                                <th>Ubicación</th>
                                <th>Fecha/Hora</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <h2>👤 Usuarios</h2>
                <div class="table-responsive">
                    <table id="tabla-usuarios">
                        <thead>
                            <tr>
                                <th>Email</th>
                                <th>Nombre</th>
                                <th>Rol</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="panel">
                <h2>👥 Personas</h2>
                <div class="table-responsive">
                    <table id="tabla-personas">
                        <thead>
                            <tr>
                                <th>Nombre</th>
                                <th>Cédula</th>
                                <th>Perfil</th>
                            </tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        var token = localStorage.getItem('api_token');

        window.addEventListener('load', async function() {
            if (!token) {
                try {
                    var resp = await fetch('/api/auth/token-sistema');
                    if (resp.ok) { var data = await resp.json(); token = data.token; localStorage.setItem('api_token', token); }
                } catch(e) {}
            }
            cargarDatos();
            setInterval(cargarDatos, 5000);
        });

        async function cargarDatos() {
            try {
                var respRegistros = await fetch('/api/registros-acceso', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var respUsuarios = await fetch('/api/usuarios', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                var respPersonas = await fetch('/api/personas', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });

                if (respRegistros.ok && respUsuarios.ok && respPersonas.ok) {
                    var registrosData = await respRegistros.json();
                    var registros = registrosData.registros || [];
                    var usuariosData = await respUsuarios.json();
                    var usuarios = usuariosData.usuarios || [];
                    var personasData = await respPersonas.json();
                    var personas = personasData.personas || [];

                    var entradas = registros.filter(r => r.tipo === 'ENTRADA').length;
                    var salidas = registros.filter(r => r.tipo === 'SALIDA').length;

                    document.getElementById('total').textContent = registros.length;
                    document.getElementById('entradas').textContent = entradas;
                    document.getElementById('salidas').textContent = salidas;
                    document.getElementById('usuarios').textContent = usuarios.length;

                    var html = '';
                    registros.slice(-20).reverse().forEach(r => {
                        var badge = r.tipo === 'ENTRADA' ? 'badge-entrada' : 'badge-salida';
                        var fecha = new Date(r.created_at).toLocaleString('es-CO');
                        html += '<tr><td>' + (r.persona ? r.persona.nombre : 'N/A') + '</td><td>' + (r.persona ? r.persona.numero_doc : 'N/A') + '</td><td><span class="badge ' + badge + '">' + r.tipo + '</span></td><td>' + (r.ambiente || '-') + '</td><td>' + fecha + '</td></tr>';
                    });
                    document.querySelector('#tabla-registros tbody').innerHTML = html || '<tr><td colspan="5" style="text-align:center;color:#999;">Sin registros</td></tr>';

                    html = '';
                    usuarios.forEach(u => {
                        html += '<tr><td>' + u.email + '</td><td>' + u.nombre + '</td><td>' + u.rol + '</td></tr>';
                    });
                    document.querySelector('#tabla-usuarios tbody').innerHTML = html || '<tr><td colspan="3" style="text-align:center;color:#999;">Sin usuarios</td></tr>';

                    html = '';
                    personas.forEach(p => {
                        html += '<tr><td>' + p.nombre + '</td><td>' + p.numero_doc + '</td><td>' + p.perfil + '</td></tr>';
                    });
                    document.querySelector('#tabla-personas tbody').innerHTML = html || '<tr><td colspan="3" style="text-align:center;color:#999;">Sin personas</td></tr>';
                }
            } catch (e) {
                console.log('Error:', e);
            }
        }

        async function crearPersona() {
            var nombre = document.getElementById('nombre-persona').value.trim();
            var cedula = document.getElementById('cedula').value.trim();
            var perfil = document.getElementById('perfil').value;

            if (!nombre || !cedula) {
                mostrarAlerta('alerta-persona', 'error', '⚠️ Completa los campos');
                return;
            }

            try {
                var resp = await fetch('/api/personas', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        nombre,
                        numero_doc: cedula,
                        tipo_doc: 'CC',
                        perfil: perfil,
                        telefono: document.getElementById('telefono').value
                    })
                });

                if (resp.ok) {
                    mostrarAlerta('alerta-persona', 'success', '✓ Persona registrada exitosamente');
                    document.getElementById('nombre-persona').value = '';
                    document.getElementById('cedula').value = '';
                    cargarDatos();
                }
            } catch (e) {
                mostrarAlerta('alerta-persona', 'error', '✕ Error: ' + e.message);
            }
        }

        function mostrarAlerta(id, tipo, msg) {
            var alert = document.getElementById(id);
            alert.className = 'alert ' + tipo;
            alert.textContent = msg;
            alert.style.display = 'block';
            setTimeout(() => { alert.style.display = 'none'; }, 4000);
        }
    </script>
</body>
</html>
