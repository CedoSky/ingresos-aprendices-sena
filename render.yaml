services:
  # Aplicación Web
  - type: web
    name: sena-ingresos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && python wsgi.py"
    
    # Variables de entorno
    envVars:
      - key: FLASK_ENV
        value: production

      - key: PYTHON_VERSION
        value: 3.12.10
        
      - key: SECRET_KEY
        generateValue: true
        
      - key: JWT_SECRET_KEY
        generateValue: true

      - key: ADMIN_PASSWORD
        sync: false

      - key: VIGILANTE_PASSWORD
        sync: false
        
      - key: DATABASE_URL
        fromDatabase:
          name: sena-db
          property: connectionString
    
    # Salud del servicio
    healthCheckPath: /health
    
    # Tamaño del plan
    plan: free
    
databases:
  - name: sena-db
    databaseName: sena_db
    user: sena_user
    plan: free
