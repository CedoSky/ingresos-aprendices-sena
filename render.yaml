services:
  # Aplicación Web
  - type: web
    name: sena-ingresos
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && gunicorn -w 1 -b 0.0.0.0:$PORT wsgi:app --timeout 60 --keep-alive 5"
    
    # Variables de entorno
    envVars:
      - key: FLASK_ENV
        value: production
        
      - key: SECRET_KEY
        generateValue: true
        
      - key: JWT_SECRET_KEY
        generateValue: true
        
      - key: DATABASE_URL
        fromDatabase:
          name: sena-db
          property: connectionString
    
    # Salud del servicio
    healthCheckPath: /health
    
    # Tamaño del plan
    plan: free
    
databases:
  - name: sena-db
    databaseName: sena_db
    user: sena_user
    plan: free
